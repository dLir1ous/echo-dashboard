<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo Show Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  body {
    background: #0d1117; color: #f0f6fc;
    display: flex; height: 100vh; padding: 14px; gap: 14px; overflow: hidden;
  }
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 18px;
    padding: 16px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .left { flex: 1; min-width: 0; }
  .right { flex: 1.25; min-width: 0; }
  .clock-group { display: flex; flex-direction: column; justify-content: center; flex: 1; }
  .time-row { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
  #time { font-size: 5.3rem; font-weight: 700; line-height: 0.95; letter-spacing: -2px; }
  #ampm { font-size: 1.3rem; font-weight: 700; color: #8b949e; text-transform: uppercase; }
  #date { font-size: 1.25rem; color: #8b949e; margin-top: 10px; }
  .spotify-btn {
    background: #1db954; color: #000; border: none; border-radius: 14px;
    padding: 13px; font-size: 1.15rem; font-weight: 700; cursor: pointer;
    text-align: center; text-decoration: none; display: block; margin-top: 10px;
  }
  .spotify-btn:active { opacity: 0.85; }
  .current-row { display: flex; align-items: baseline; justify-content: space-between; }
  #weather-temp { font-size: 3.4rem; font-weight: 700; color: #58a6ff; line-height: 1; }
  #weather-desc { font-size: 1.15rem; color: #8b949e; font-weight: 500; }
  .forecast {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    background: #0d1117; border: 1px solid #21262d; border-radius: 14px;
    padding: 14px 6px; text-align: center; flex: 1; margin-top: 14px; align-items: center;
  }
  .day-col {
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    height: 100%; padding: 4px 0;
  }
  .day-name { font-size: 0.95rem; font-weight: 700; color: #8b949e; text-transform: uppercase; }
  .day-icon { font-size: 1.9rem; line-height: 1.1; }
  .day-temps { display: flex; flex-direction: column; font-size: 1.05rem; font-weight: 700; color: #f0f6fc; line-height: 1.25; }
  .day-low { color: #8b949e; font-weight: 500; font-size: 0.9rem; }
</style>
</head>
<body>
  <div class="card left">
    <div class="clock-group">
      <div class="time-row">
        <span id="time">--:--</span>
        <span id="ampm">--</span>
      </div>
      <div id="date">Loading date...</div>
    </div>
    <a class="spotify-btn" href="spotify://">
      ▶ Open Spotify
    </a>
  </div>

  <div class="card right">
    <div class="current-row">
      <div id="weather-temp">--°F</div>
      <div id="weather-desc">Richardson, TX</div>
    </div>

    <div class="forecast" id="forecast">
      <div class="day-col"><span class="day-name">---</span><span class="day-icon">--</span><span class="day-temps">--°</span></div>
      <div class="day-col"><span class="day-name">---</span><span class="day-icon">--</span><span class="day-temps">--°</span></div>
      <div class="day-col"><span class="day-name">---</span><span class="day-icon">--</span><span class="day-temps">--°</span></div>
      <div class="day-col"><span class="day-name">---</span><span class="day-icon">--</span><span class="day-temps">--°</span></div>
      <div class="day-col"><span class="day-name">---</span><span class="day-icon">--</span><span class="day-temps">--°</span></div>
    </div>
  </div>

<script>
  function updateClock() {
    const now = new Date();
    let hours = now.getHours();
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    const mins = String(now.getMinutes()).padStart(2, '0');

    document.getElementById('time').textContent = `${hours}:${mins}`;
    document.getElementById('ampm').textContent = ampm;
    document.getElementById('date').textContent = now.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
  }

  function getIconFromDesc(desc) {
    const t = desc.toLowerCase();
    if (t.includes('thunder') || t.includes('storm')) return '⛈️';
    if (t.includes('snow') || t.includes('sleet') || t.includes('blizzard')) return '❄️';
    if (t.includes('rain') || t.includes('drizzle') || t.includes('shower')) return '🌧️';
    if (t.includes('cloud') || t.includes('overcast')) return '⛅';
    if (t.includes('fog') || t.includes('mist')) return '🌫️';
    return '☀️';
  }

  async function updateWeather() {
    try {
      const nwsUrl = 'https://weather.gov';
      const proxyUrl = 'https://allorigins.win' + encodeURIComponent(nwsUrl);
      const res = await fetch(proxyUrl);
      const wrapper = await res.json();
      const data = JSON.parse(wrapper.contents);
      const periods = data.properties.periods;

      document.getElementById('weather-temp').textContent = periods[0].temperature + '°F';
      document.getElementById('weather-desc').textContent = 'Richardson, TX';

      const container = document.getElementById('forecast');
      container.innerHTML = '';
      const days = periods.filter(p => p.isDaytime).slice(0, 5);
      const nights = periods.filter(p => !p.isDaytime);

      days.forEach((day, idx) => {
        const label = idx === 0 ? 'Today' : day.name.slice(0, 3);
        const icon = getIconFromDesc(day.shortForecast);
        const hi = day.temperature;
        const lo = nights[idx] ? nights[idx].temperature : '--';

        container.innerHTML += `
          <div class="day-col">
            <span class="day-name">${label}</span>
            <span class="day-icon">${icon}</span>
            <span class="day-temps"><span>${hi}°</span><span class="day-low">${lo}°</span></span>
          </div>`;
      });
    } catch (e) {
      document.getElementById('weather-desc').textContent = 'Err: ' + e.message;
    }
  }

  updateClock();
  setInterval(updateClock, 1000);
  updateWeather();
  setInterval(updateWeather, 900000);
</script>
</body>
</html>
