<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo Show Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  body {
    background: #0d1117; color: #f0f6fc;
    display: flex; flex-direction: column; height: 100vh; padding: 12px; gap: 10px; overflow: hidden;
    transition: filter 0.6s ease, background-color 0.6s ease;
  }
  body.night { background: #000000; filter: brightness(0.35); }
  body.night .card, body.night .forecast, body.night .news-bar {
    background: #080a0e; border-color: #161b22;
  }
  .top-grid {
    display: flex; flex: 1; gap: 12px; min-height: 0;
  }
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 18px;
    padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .left { flex: 1.08; min-width: 0; }
  .right { flex: 1.22; min-width: 0; }
  .clock-group {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; flex: 1;
  }
  .time-row {
    display: flex; align-items: baseline; justify-content: center;
    gap: 5px; white-space: nowrap;
  }
  #time { font-size: 12.2vw; font-weight: 700; line-height: 0.95; letter-spacing: -2px; }
  #ampm { font-size: 3.4vw; font-weight: 700; color: #8b949e; text-transform: uppercase; }
  #date { font-size: 2.9vw; color: #8b949e; margin-top: 8px; }

  .btn-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;
  }
  .app-btn {
    border: none; border-radius: 12px; padding: 11px 8px;
    font-size: 2.4vw; font-weight: 700; cursor: pointer;
    text-align: center; text-decoration: none; display: block; white-space: nowrap;
  }
  .app-btn:active { opacity: 0.85; }
  .spotify-btn { background: #1db954; color: #000; }
  .news-btn { background: #30363d; color: #f0f6fc; border: 1px solid #484f58; }

  .current-row { display: flex; align-items: baseline; justify-content: space-between; }
  #weather-temp { font-size: 7.8vw; font-weight: 700; color: #58a6ff; line-height: 1; }
  #weather-desc { font-size: 2.6vw; color: #8b949e; font-weight: 500; }
  .forecast {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    background: #0d1117; border: 1px solid #21262d; border-radius: 14px;
    padding: 10px 6px; text-align: center; flex: 1; margin-top: 10px; align-items: center;
  }
  .day-col {
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    height: 100%; padding: 2px 0;
  }
  .day-name { font-size: 2.1vw; font-weight: 700; color: #8b949e; text-transform: uppercase; }
  .day-icon { font-size: 4.2vw; line-height: 1.1; }
  .day-temps { display: flex; flex-direction: column; font-size: 2.4vw; font-weight: 700; color: #f0f6fc; line-height: 1.2; }
  .day-low { color: #8b949e; font-weight: 500; font-size: 2vw; }

  .news-bar {
    background: #161b22; border: 1px solid #30363d; border-radius: 14px;
    padding: 10px 14px; display: flex; align-items: center; gap: 10px;
    white-space: nowrap; overflow: hidden;
  }
  .news-badge {
    background: #da3633; color: #fff; font-size: 1.9vw; font-weight: 800;
    padding: 3px 8px; border-radius: 6px; text-transform: uppercase; flex-shrink: 0;
  }
  #news-text {
    font-size: 2.3vw; color: #e6edf3; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis;
  }
</style>
</head>
<body>
  <div class="top-grid">
    <div class="card left">
      <div class="clock-group">
        <div class="time-row">
          <span id="time">--:--</span>
          <span id="ampm">--</span>
        </div>
        <div id="date">Loading date...</div>
      </div>

      <div class="btn-row">
        <a class="app-btn spotify-btn" href="spotify://">▶ Spotify</a>
        <button class="app-btn news-btn" onclick="nextHeadline()">📰 Next News</button>
      </div>
    </div>

    <div class="card right">
      <div class="current-row">
        <div id="weather-temp">--°F</div>
        <div id="weather-desc">Richardson, TX</div>
      </div>

      <div class="forecast" id="forecast">
        <div class="day-col"><span class="day-name">---</span><span class="day-icon">--</span><span class="day-temps">--°</span></div>
        <div class="day-col"><span class="day-name">---</span><span class="day-icon">--</span><span class="day-temps">--°</span></div>
        <div class="day-col"><span class="day-name">---</span><span class="day-icon">--</span><span class="day-temps">--°</span></div>
        <div class="day-col"><span class="day-name">---</span><span class="day-icon">--</span><span class="day-temps">--°</span></div>
        <div class="day-col"><span class="day-name">---</span><span class="day-icon">--</span><span class="day-temps">--°</span></div>
      </div>
    </div>
  </div>

  <div class="news-bar" onclick="nextHeadline()">
    <span class="news-badge">NEWS</span>
    <span id="news-text">Loading top headlines...</span>
  </div>

<script>
  let wakeUntil = 0;
  let headlines = [];
  let newsIndex = 0;

  function updateClock() {
    const now = new Date();
    const rawHour = now.getHours();
    const ampm = rawHour >= 12 ? 'PM' : 'AM';
    const hours = rawHour % 12 || 12;
    const mins = String(now.getMinutes()).padStart(2, '0');

    document.getElementById('time').textContent = `${hours}:${mins}`;
    document.getElementById('ampm').textContent = ampm;
    document.getElementById('date').textContent = now.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });

    const isNightHours = rawHour >= 22 || rawHour < 6;
    if (isNightHours && Date.now() > wakeUntil) {
      document.body.classList.add('night');
    } else {
      document.body.classList.remove('night');
    }
  }

  document.body.addEventListener('click', () => {
    wakeUntil = Date.now() + 15000;
    document.body.classList.remove('night');
  });

  function nextHeadline() {
    if (!headlines.length) return;
    newsIndex = (newsIndex + 1) % headlines.length;
    document.getElementById('news-text').textContent = headlines[newsIndex];
  }

  function renderData() {
    const data = window.WEATHER_DATA;
    if (!data) return;

    if (data.days && data.days.length) {
      document.getElementById('weather-temp').textContent = data.temp + '°F';
      document.getElementById('weather-desc').textContent = 'Richardson, TX';

      const container = document.getElementById('forecast');
      container.innerHTML = '';
      data.days.forEach(d => {
        container.innerHTML += `
          <div class="day-col">
            <span class="day-name">${d.label}</span>
            <span class="day-icon">${d.icon}</span>
            <span class="day-temps"><span>${d.hi}°</span><span class="day-low">${d.lo}°</span></span>
          </div>`;
      });
    }

    if (data.news && data.news.length) {
      headlines = data.news;
      newsIndex = 0;
      document.getElementById('news-text').textContent = headlines;
    }
  }

  function loadDataScript() {
    const old = document.getElementById('w-script');
    if (old) old.remove();
    const s = document.createElement('script');
    s.id = 'w-script';
    s.src = './weather.js?t=' + Date.now();
    s.onload = renderData;
    document.body.appendChild(s);
  }

  updateClock();
  setInterval(updateClock, 1000);
  loadDataScript();
  setInterval(loadDataScript, 900000);
  setInterval(nextHeadline, 12000);
</script>
</body>
</html>
