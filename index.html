<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo Show Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  body {
    background: #0d1117; color: #f0f6fc;
    display: flex; height: 100vh; padding: 14px; gap: 14px; overflow: hidden;
  }
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 18px;
    padding: 16px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .left { flex: 1.05; min-width: 0; }
  .right { flex: 1.25; min-width: 0; }
  .clock-group { display: flex; flex-direction: column; justify-content: center; flex: 1; }
  .time-row { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
  #time { font-size: 15vw; font-weight: 700; line-height: 0.95; letter-spacing: -3px; }
  #ampm { font-size: 4.2vw; font-weight: 700; color: #8b949e; text-transform: uppercase; }
  #date { font-size: 3.3vw; color: #8b949e; margin-top: 10px; }
  .spotify-btn {
    background: #1db954; color: #000; border: none; border-radius: 14px;
    padding: 14px; font-size: 3vw; font-weight: 700; cursor: pointer;
    text-align: center; text-decoration: none; display: block; margin-top: 10px;
  }
  .spotify-btn:active { opacity: 0.85; }
  .current-row { display: flex; align-items: baseline; justify-content: space-between; }
  #weather-temp { font-size: 8.5vw; font-weight: 700; color: #58a6ff; line-height: 1; }
  #weather-desc { font-size: 2.8vw; color: #8b949e; font-weight: 500; }
  .forecast {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    background: #0d1117; border: 1px solid #21262d; border-radius: 14px;
    padding: 14px 6px; text-align: center; flex: 1; margin-top: 14px; align-items: center;
  }
  .day-col {
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    height: 100%; padding: 4px 0;
  }
  .day-name { font-size: 2.3vw; font-weight: 700; color: #8b949e; text-transform: uppercase; }
  .day-icon { font-size: 4.6vw; line-height: 1.1; }
  .day-temps { display: flex; flex-direction: column; font-size: 2.6vw; font-weight: 700; color: #f0f6fc; line-height: 1.25; }
  .day-low { color: #8b949e; font-weight: 500; font-size: 2.2vw; }
</style>
</head>
<body>
  <div class="card left">
    <div class="clock-group">
      <div class="time-row">
        <span id="time">--:--</span>
        <span id="ampm">--</span>
      </div>
      <div id="date">Loading date...</div>
    </div>
    <a class="spotify-btn" href="spotify://">
      ▶ Open Spotify
    </a>
  </div>

  <div class="card right">
    <div class="current-row">
      <div id="weather-temp">--°F</div>
      <div id="weather-desc">Richardson, TX</div>
    </div>

    <div class="forecast" id="forecast">
      <div class="day-col"><span class="day-name">---</span><span class="day-icon">--</span><span class="day-temps">--°</span></div>
      <div class="day-col"><span class="day-name">---</span><span class="day-icon">--</span><span class="day-temps">--°</span></div>
      <div class="day-col"><span class="day-name">---</span><span class="day-icon">--</span><span class="day-temps">--°</span></div>
      <div class="day-col"><span class="day-name">---</span><span class="day-icon">--</span><span class="day-temps">--°</span></div>
      <div class="day-col"><span class="day-name">---</span><span class="day-icon">--</span><span class="day-temps">--°</span></div>
    </div>
  </div>

<script>
  function updateClock() {
    const now = new Date();
    let hours = now.getHours();
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    const mins = String(now.getMinutes()).padStart(2, '0');

    document.getElementById('time').textContent = `${hours}:${mins}`;
    document.getElementById('ampm').textContent = ampm;
    document.getElementById('date').textContent = now.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
  }

  function getIcon(code) {
    if (code === 0) return '☀️';
    if (code <= 3) return '⛅';
    if (code <= 48) return '🌫️';
    if (code <= 67) return '🌧️';
    if (code <= 77) return '❄️';
    if (code <= 82) return '🌦️';
    return '⛈️';
  }

  function renderWeather() {
    const data = window.WEATHER_DATA;
    if (!data || !data.current) {
      document.getElementById('weather-desc').textContent = 'Waiting for weather.js...';
      return;
    }

    document.getElementById('weather-temp').textContent = Math.round(data.current.temperature_2m) + '°F';
    document.getElementById('weather-desc').textContent = 'Richardson, TX';

    const container = document.getElementById('forecast');
    container.innerHTML = '';
    for (let i = 0; i < 5; i++) {
      const d = new Date(data.daily.time[i] + 'T12:00:00');
      const label = i === 0 ? 'Today' : d.toLocaleDateString([], { weekday: 'short' });
      const icon = getIcon(data.daily.weather_code[i]);
      const hi = Math.round(data.daily.temperature_2m_max[i]);
      const lo = Math.round(data.daily.temperature_2m_min[i]);

      container.innerHTML += `
        <div class="day-col">
          <span class="day-name">${label}</span>
          <span class="day-icon">${icon}</span>
          <span class="day-temps"><span>${hi}°</span><span class="day-low">${lo}°</span></span>
        </div>`;
    }
  }

  function loadWeatherScript() {
    const old = document.getElementById('w-script');
    if (old) old.remove();
    const s = document.createElement('script');
    s.id = 'w-script';
    s.src = './weather.js?t=' + Date.now();
    s.onload = renderWeather;
    s.onerror = function() {
      document.getElementById('weather-desc').textContent = 'weather.js not found';
    };
    document.body.appendChild(s);
  }

  updateClock();
  setInterval(updateClock, 1000);
  loadWeatherScript();
  setInterval(loadWeatherScript, 900000);
</script>
</body>
</html>
