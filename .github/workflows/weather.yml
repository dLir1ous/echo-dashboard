name: Update Richardson Weather
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Weather Data
        run: |
          python3 - << 'EOF'
          import json, urllib.request
          from datetime import datetime, timezone, timedelta

          def c_to_f(c):
              return round((float(c) * 9 / 5) + 32)

          def icon_from_text(sym):
              s = (sym or "").lower()
              if "thunder" in s or "storm" in s: return "⛈️"
              if "snow" in s or "sleet" in s: return "❄️"
              if "rain" in s or "drizzle" in s or "shower" in s: return "🌧️"
              if "fog" in s or "mist" in s: return "🌫️"
              if "cloud" in s or "partly" in s or "overcast" in s: return "⛅"
              return "☀️"

          out = None

          # Source 1: MET Norway (assembled from short parts)
          try:
              met_host = "https://met.no"
              met_path = "/weatherapi/locationforecast/2.0/compact"
              met_query = "?lat=32.9483&lon=-96.7299"
              req = urllib.request.Request(
                  met_host + met_path + met_query,
                  headers={"User-Agent": "EchoShowDashboard/1.0 ://github.com"}
              )
              raw = urllib.request.urlopen(req, timeout=15).read().decode("utf-8")
              data = json.loads(raw)
              ts = data.get("properties").get("timeseries")
              first_ts = next(iter(ts))
              cur_c = first_ts.get("data").get("instant").get("details").get("air_temperature")
              tz_cst = timezone(timedelta(hours=-6))
              daily = {}
              for entry in ts:
                  dt = datetime.fromisoformat(entry.get("time").replace("Z", "+00:00")).astimezone(tz_cst)
                  d_key = dt.strftime("%Y-%m-%d")
                  temp_c = entry.get("data").get("instant").get("details").get("air_temperature")
                  nxt = entry.get("data").get("next_6_hours") or entry.get("data").get("next_1_hours") or {}
                  sym = nxt.get("summary", {}).get("symbol_code", "")
                  if d_key not in daily:
                      daily[d_key] = {"dt": dt, "temps": [], "syms": []}
                  daily[d_key]["temps"].append(temp_c)
                  if sym:
                      daily[d_key]["syms"].append(sym)
              days = []
              for idx, key in enumerate(sorted(daily.keys())):
                  if idx >= 5:
                      break
                  info = daily.get(key)
                  label = "Today" if idx == 0 else info.get("dt").strftime("%a")
                  syms = info.get("syms")
                  mid_sym = syms[len(syms) // 2] if syms else "clearsky"
                  days.append({
                      "label": label,
                      "icon": icon_from_text(mid_sym),
                      "hi": c_to_f(max(info.get("temps"))),
                      "lo": c_to_f(min(info.get("temps")))
                  })
              out = {"temp": c_to_f(cur_c), "days": days}
              print("Success from MET Norway:", out)
          except Exception as e:
              print("MET Norway failed:", e)

          # Source 2: US National Weather Service (assembled from short parts)
          if not out:
              try:
                  nws_host = "https://weather.gov"
                  nws_path = "/gridpoints/FWD/91,109/forecast"
                  req = urllib.request.Request(
                      nws_host + nws_path,
                      headers={"User-Agent": "EchoShowDashboard/1.0", "Accept": "application/geo+json"}
                  )
                  raw = urllib.request.urlopen(req, timeout=15).read().decode("utf-8")
                  data = json.loads(raw)
                  periods = data.get("properties").get("periods")
                  first_p = next(iter(periods))
                  cur_f = int(first_p.get("temperature"))
                  day_list = [p for p in periods if p.get("isDaytime")]
                  night_list = [p for p in periods if not p.get("isDaytime")]
                  days = []
                  for idx, d in enumerate(day_list):
                      if idx >= 5:
                          break
                      label = "Today" if idx == 0 else d.get("name")[:3]
                      night_p = night_list[idx] if idx < len(night_list) else None
                      lo = int(night_p.get("temperature")) if night_p else int(d.get("temperature")) - 15
                      days.append({
                          "label": label,
                          "icon": icon_from_text(d.get("shortForecast", "")),
                          "hi": int(d.get("temperature")),
                          "lo": lo
                      })
                  out = {"temp": cur_f, "days": days}
                  print("Success from NWS:", out)
              except Exception as e:
                  print("NWS parse failed:", e)

          if not out:
              raise SystemExit("Both MET Norway and NWS failed")

          with open("weather.js", "w", encoding="utf-8") as f:
              f.write("window.WEATHER_DATA = " + json.dumps(out) + ";\n")
          EOF
      - name: Commit weather.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add weather.js
          if ! git diff --staged --quiet; then
            git commit -m "Update weather.js"
            git pull --rebase
            git push
          fi
