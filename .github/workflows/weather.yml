name: Update Richardson Weather
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Weather Data
        run: |
          curl --http1.1 -sS -L \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            -H "Accept: application/json" \
            "https://open-meteo.com" \
            -o raw.json

          echo "Downloaded bytes: $(wc -c < raw.json)"
          head -c 200 raw.json
          echo ""

          python3 - << 'EOF'
          import json
          from datetime import datetime

          def get_icon(code):
              if code == 0: return "☀️"
              if code <= 3: return "⛅"
              if code <= 48: return "🌫️"
              if code <= 67: return "🌧️"
              if code <= 77: return "❄️"
              if code <= 82: return "🌦️"
              return "⛈️"

          with open("raw.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          cur_f = round(data["current"]["temperature_2m"])
          daily = data["daily"]
          days = []
          for i in range(5):
              dt = datetime.strptime(daily["time"][i], "%Y-%m-%d")
              label = "Today" if i == 0 else dt.strftime("%a")
              days.append({
                  "label": label,
                  "icon": get_icon(daily["weather_code"][i]),
                  "hi": round(daily["temperature_2m_max"][i]),
                  "lo": round(daily["temperature_2m_min"][i])
              })

          out = {"temp": cur_f, "days": days}
          with open("weather.js", "w", encoding="utf-8") as f:
              f.write("window.WEATHER_DATA = " + json.dumps(out) + ";\n")
          print("Successfully built weather.js:", out)
          EOF
      - name: Commit weather.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add weather.js
          if ! git diff --staged --quiet; then
            git commit -m "Update weather.js"
            git pull --rebase
            git push
          fi
