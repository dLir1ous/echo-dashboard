name: Update Richardson Weather
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Weather Data
        run: |
          curl --http1.1 -sS -L \
            -H "User-Agent: EchoShowDashboard/1.0 (https://github.com)" \
            -H "Accept: application/json" \
            "https://met.no" \
            -o met.json

          curl --http1.1 -sS -L \
            -H "User-Agent: (EchoShowDashboard, https://github.com)" \
            -H "Accept: application/geo+json" \
            "https://weather.gov" \
            -o nws.json

          python3 - << 'EOF'
          import json
          from datetime import datetime, timezone, timedelta

          def c_to_f(c):
              return round((float(c) * 9 / 5) + 32)

          def icon_from_text(sym):
              s = (sym or "").lower()
              if "thunder" in s or "storm" in s: return "⛈️"
              if "snow" in s or "sleet" in s: return "❄️"
              if "rain" in s or "drizzle" in s or "shower" in s: return "🌧️"
              if "fog" in s or "mist" in s: return "🌫️"
              if "cloud" in s or "partly" in s or "overcast" in s: return "⛅"
              return "☀️"

          out = None

          # Try MET Norway JSON first
          try:
              with open("met.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
              ts = data["properties"]["timeseries"]
              cur_c = ts["data"]["instant"]["details"]["air_temperature"]
              tz_cst = timezone(timedelta(hours=-6))
              daily = {}
              for entry in ts:
                  dt = datetime.fromisoformat(entry["time"].replace("Z", "+00:00")).astimezone(tz_cst)
                  d_key = dt.strftime("%Y-%m-%d")
                  temp_c = entry["data"]["instant"]["details"]["air_temperature"]
                  nxt = entry["data"].get("next_6_hours") or entry["data"].get("next_1_hours") or {}
                  sym = nxt.get("summary", {}).get("symbol_code", "")
                  if d_key not in daily:
                      daily[d_key] = {"dt": dt, "temps": [], "syms": []}
                  daily[d_key]["temps"].append(temp_c)
                  if sym:
                      daily[d_key]["syms"].append(sym)
              days = []
              for idx, key in enumerate(sorted(daily.keys())[:5]):
                  info = daily[key]
                  label = "Today" if idx == 0 else info["dt"].strftime("%a")
                  mid_sym = info["syms"][len(info["syms"]) // 2] if info["syms"] else "clearsky"
                  days.append({
                      "label": label,
                      "icon": icon_from_text(mid_sym),
                      "hi": c_to_f(max(info["temps"])),
                      "lo": c_to_f(min(info["temps"]))
                  })
              out = {"temp": c_to_f(cur_c), "days": days}
              print("Success from MET Norway:", out)
          except Exception as e:
              print("MET Norway parse failed:", e)

          # Fallback to US National Weather Service JSON
          if not out:
              try:
                  with open("nws.json", "r", encoding="utf-8") as f:
                      data = json.load(f)
                  periods = data["properties"]["periods"]
                  cur_f = int(periods["temperature"])
                  day_list = [p for p in periods if p.get("isDaytime")][:5]
                  night_list = [p for p in periods if not p.get("isDaytime")]
                  days = []
                  for idx, d in enumerate(day_list):
                      label = "Today" if idx == 0 else d["name"][:3]
                      lo = int(night_list[idx]["temperature"]) if idx < len(night_list) else int(d["temperature"]) - 15
                      days.append({
                          "label": label,
                          "icon": icon_from_text(d.get("shortForecast", "")),
                          "hi": int(d["temperature"]),
                          "lo": lo
                      })
                  out = {"temp": cur_f, "days": days}
                  print("Success from NWS:", out)
              except Exception as e:
                  print("NWS parse failed:", e)

          if not out:
              raise SystemExit("Both MET Norway and NWS failed")

          with open("weather.js", "w", encoding="utf-8") as f:
              f.write("window.WEATHER_DATA = " + json.dumps(out) + ";\n")
          EOF
      - name: Commit weather.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add weather.js
          if ! git diff --staged --quiet; then
            git commit -m "Update weather.js"
            git pull --rebase
            git push
          fi
