name: Update Richardson Weather
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Weather Data
        run: |
          python3 - << 'EOF'
          import json, urllib.request

          urls = [
              ("NWS", "https://weather.gov", {"User-Agent": "EchoShowDashboard/1.0 (contact@example.com)", "Accept": "application/geo+json"}),
              ("OpenMeteo", "https://open-meteo.com", {"User-Agent": "Mozilla/5.0"}),
          ]

          saved = False
          for name, url, headers in urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  raw = urllib.request.urlopen(req, timeout=15).read().decode("utf-8")
                  data = json.loads(raw)
                  with open("weather.js", "w", encoding="utf-8") as f:
                      f.write("window.WEATHER_DATA = " + json.dumps(data) + ";\n")
                  print(f"Success from {name}")
                  saved = True
                  break
              except Exception as e:
                  print(f"{name} failed: {e}")

          if not saved:
              raise SystemExit("All weather sources failed")
          EOF
      - name: Commit weather.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add weather.js
          git diff --staged --quiet || git commit -m "Update weather.js"
          git push
