name: Update Richardson Weather
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Open-Meteo Forecast
        run: |
          curl -f -s "https://open-meteo.com" -o weather.json
          test -s weather.json
      - name: Commit weather.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add weather.json
          git diff --staged --quiet || git commit -m "Update weather"
          git push
