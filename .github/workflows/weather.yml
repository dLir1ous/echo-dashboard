name: Update Richardson Weather
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch NWS Forecast
        run: |
          curl -f -sS -H "User-Agent: (EchoShowDashboard, contact@example.com)" -H "Accept: application/geo+json" "https://weather.gov" -o raw.json
          python3 -m json.tool raw.json > /dev/null
          printf "window.WEATHER_DATA = " > weather.js
          cat raw.json >> weather.js
          echo ";" >> weather.js
      - name: Commit weather.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add weather.js
          git diff --staged --quiet || git commit -m "Update weather.js"
          git push
