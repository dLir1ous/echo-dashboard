name: Update Richardson Weather
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Open-Meteo Forecast
        run: |
          DATA=$(curl -f -s "https://open-meteo.com")
          test -n "$DATA"
          echo "window.WEATHER_DATA = $DATA;" > weather.js
      - name: Commit weather.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add weather.js
          git diff --staged --quiet || git commit -m "Update weather.js"
          git push
